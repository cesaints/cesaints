<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480">
  <title>Carlos Eduardo, architectural drawing</title>
  <desc>A decorative drawing of a client, a trust boundary and a service.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#E0EDFF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="480" rx="18" fill="#102442"/>
  <rect x="1" y="1" width="758" height="478" rx="17" fill="url(#grid)"/>
  <g font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" fill="#E0EDFF">
    <text x="46" y="124" font-size="76" font-weight="700" letter-spacing="-3">Carlos Eduardo</text>
    <text x="48" y="178" font-size="32">Systems have boundaries.</text>
  </g>
  <g stroke="#91BCFF" stroke-width="1.5" fill="none">
    <path d="M46 217h668"/><path d="M46 38v14m-7-7h14M714 38v14m-7-7h14"/>
  </g>
  <g font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" stroke="#91BCFF" stroke-width="2" fill="none">
   <g transform="translate(46 274)">
    <rect x="0" y="20" width="180" height="88" rx="8"/>
    <path d="M180 64h88m30 0h82m-12-8 12 8-12 8"/>
    <path d="M282 0v130" stroke-dasharray="7 7"/>
    <rect x="380" y="20" width="288" height="88" rx="8"/>
    <g fill="#E0EDFF" stroke="none" font-size="32">
      <text x="90" y="74" text-anchor="middle">Client</text>
      <text x="524" y="74" text-anchor="middle">Service</text>
      <text x="282" y="167" text-anchor="middle" font-size="32">Trust boundary</text>
    </g>
   </g>
  </g>
</svg>
